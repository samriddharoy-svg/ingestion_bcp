# Build and push the stock-ingestion base image to dev ECR (account: 961743402154 / ap-south-1).
# CMD is overridden per task at ECS deployment time.
name: Deploy Development

on:
  push:
    branches:
      - bcp-ingestion-pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  build-and-push:
    uses: ./.github/workflows/ecr_push.yml
    with:
      aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_KEY_DEV }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_DEV }}
