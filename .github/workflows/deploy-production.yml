# Build and push the stock-ingestion base image to prod ECR (account: 961743402154 / ap-south-1).
# CMD is overridden per task at ECS deployment time.
name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-push:
    uses: ./.github/workflows/ecr_push.yml
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-west-2' }}
    secrets:
      aws_access_key_id: ${{ secrets.ARGUS_AWS_KEY_PRODUCTION }}
      aws_secret_access_key: ${{ secrets.ARGUS_AWS_SECRET_PRODUCTION }}
