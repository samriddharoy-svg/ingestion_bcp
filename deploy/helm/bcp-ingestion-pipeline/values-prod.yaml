# Production environment overrides for bcp-ingestion-pipeline.
# Runs in prod account 961743402154, region us-west-2.
# CI sets image.repository and image.tag at deploy time via --set.

image:
  repository: 961743402154.dkr.ecr.us-west-2.amazonaws.com/stock-data-ingestion
  tag: sha-set-by-ci

serviceAccount:
  create: true
  name: bcp-ingestion-pipeline
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::961743402154:role/bcp-ingestion-pipeline-irsa-prod

config:
  PYTHONUNBUFFERED: "1"
  USE_RDS_DIRECT: "true"
  AWS_REGION: us-west-2

secretStore:
  create: true
  aws:
    service: SecretsManager
    region: us-west-2
    role: ""

externalSecret:
  enabled: true
  refreshInterval: 1h
