{{- $top := . -}}
{{- range $idx, $job := .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s" (include "bcp-ingestion-pipeline.fullname" $top) $job.name | trunc 52 | trimSuffix "-" }}
  labels:
    {{- include "bcp-ingestion-pipeline.labels" $top | nindent 4 }}
    app.kubernetes.io/component: {{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  suspend: {{ default false $job.suspend }}
  concurrencyPolicy: {{ default "Forbid" $job.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ default 3 $job.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ default 3 $job.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ default 2 $job.backoffLimit }}
      activeDeadlineSeconds: {{ default 3600 $job.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "bcp-ingestion-pipeline.selectorLabels" $top | nindent 12 }}
            app.kubernetes.io/component: {{ $job.name }}
            {{- with $top.Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $top.Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ include "bcp-ingestion-pipeline.serviceAccountName" $top }}
          restartPolicy: {{ default "OnFailure" $job.restartPolicy }}
          {{- with $top.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $top.Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $top.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $top.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $top.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ $job.name }}
              image: "{{ default $top.Values.image.repository (get $job.image "repository") }}:{{ default $top.Values.image.tag (get $job.image "tag") }}"
              imagePullPolicy: {{ default $top.Values.image.pullPolicy (get $job.image "pullPolicy") }}
              {{- with $top.Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with $job.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              envFrom:
                {{- include "bcp-ingestion-pipeline.envFrom" $top | nindent 16 }}
              {{- with $job.env }}
              env:
                {{- range $k, $v := . }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
              {{- end }}
              resources:
                {{- if $job.resources }}
                {{- toYaml $job.resources | nindent 16 }}
                {{- else }}
                {{- toYaml $top.Values.defaultResources | nindent 16 }}
                {{- end }}
{{- end }}
