# BCP stock-ingestion pipeline — replaces EventBridge → Step Functions →
# ECS RunTask with native Kubernetes CronJobs.
#
# Each entry under `cronJobs:` becomes one CronJob. They share a single
# ServiceAccount (IRSA), ConfigMap (env), SecretStore, and ExternalSecret.

nameOverride: ""
fullnameOverride: ""

# Global image defaults — each cronJob can override per-entry.
image:
  repository: 724134393175.dkr.ecr.ap-south-1.amazonaws.com/stock-data-ingestion
  tag: sha-set-by-ci
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: bcp-ingestion-pipeline
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<TARGET_ACCOUNT_ID>:role/bcp-ingestion-pipeline-irsa

# Plain env shared across every CronJob.
config:
  PYTHONUNBUFFERED: "1"
  USE_RDS_DIRECT: "true"
  AWS_REGION: ap-south-1

# Cross-account secrets, sourced via External Secrets Operator.
existingSecretName: ""
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ""
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  # Required Secrets Manager layout (create before deploy):
  #   bcp-ingestion-pipeline/db-credentials  JSON: { RDS_HOST, RDS_PORT, RDS_USER,
  #                                                  RDS_PASSWORD, RDS_DATABASE }
  #   bcp-ingestion-pipeline/api-keys        JSON: { FMP_API_KEY, TIINGO_API_KEY }
  data:
    - secretKey: RDS_HOST
      remoteRef:
        key: bcp-ingestion-pipeline/db-credentials
        property: RDS_HOST
    - secretKey: RDS_PORT
      remoteRef:
        key: bcp-ingestion-pipeline/db-credentials
        property: RDS_PORT
    - secretKey: RDS_USER
      remoteRef:
        key: bcp-ingestion-pipeline/db-credentials
        property: RDS_USER
    - secretKey: RDS_PASSWORD
      remoteRef:
        key: bcp-ingestion-pipeline/db-credentials
        property: RDS_PASSWORD
    - secretKey: RDS_DATABASE
      remoteRef:
        key: bcp-ingestion-pipeline/db-credentials
        property: RDS_DATABASE
    - secretKey: FMP_API_KEY
      remoteRef:
        key: bcp-ingestion-pipeline/api-keys
        property: FMP_API_KEY
    - secretKey: TIINGO_API_KEY
      remoteRef:
        key: bcp-ingestion-pipeline/api-keys
        property: TIINGO_API_KEY

secretStore:
  create: true
  aws:
    service: SecretsManager
    region: ap-south-1
    role: arn:aws:iam::724134393175:role/bcp-ingestion-pipeline-secrets-reader

# Default resource budget — overridable per cronJob.
defaultResources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "1000m"
    memory: 2Gi

# Schedule list. Mirrors the existing EventBridge rules:
#   HourlyStockDataFetch          cron(0 * * * ? *)             ENABLED
#   DailyStockDataFetchAfterMarket cron(0 21 * * ? *)            ENABLED
#   MarketHoursStockDataFetch     cron(0/15 14-21 ? * MON-FRI *) DISABLED
#
# Kubernetes CronJob uses the standard 5-field cron format (no seconds, no day-of-week-q).
cronJobs:
  - name: hourly
    schedule: "0 * * * *"
    suspend: false
    command: ["python", "run_fetch_all.py"]
    args: []
    env: {}
    image: {}                     # inherits global image
    activeDeadlineSeconds: 3600
    backoffLimit: 2
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    restartPolicy: OnFailure
    resources: {}                 # inherits defaultResources

  - name: daily-after-market
    schedule: "0 21 * * *"
    suspend: false
    command: ["python", "run_fetch_all.py"]
    args: []
    env:
      SCHEDULE_TAG: daily
    image: {}
    activeDeadlineSeconds: 3600
    backoffLimit: 2
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    restartPolicy: OnFailure
    resources: {}

  - name: market-hours-15m
    schedule: "*/15 14-21 * * 1-5"
    suspend: true                 # disabled in EventBridge today
    command: ["python", "run_fetch_all.py"]
    args: []
    env:
      SCHEDULE_TAG: market-hours
    image: {}
    activeDeadlineSeconds: 600
    backoffLimit: 1
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    restartPolicy: OnFailure
    resources: {}

# Optional one-shot Job, e.g. for the daily backup that lives at the same
# Step Function level today (`db-daily-full-backup`). Add entries to render
# additional Jobs (not CronJobs).
jobs: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
